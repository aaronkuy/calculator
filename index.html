<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <!-- Classic scripts on purpose: modules are blocked under file://. -->
    <script src="calculator.js" defer></script>
    <script src="index.js" defer></script>
</head>
<body>

<div id="calculator">
    <input id="display" type="text" readonly aria-label="Display">
    <div id="keys">
        <button type="button" class="key key--operator" data-key="+" aria-label="plus">+</button>
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--operator" data-key="-" aria-label="minus">-</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key--operator" data-key="*" aria-label="multiply">*</button>
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key--operator" data-key="/" aria-label="divide">/</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key="." aria-label="decimal point">.</button>
        <button type="button" class="key key--equals" data-action="equals" aria-label="equals">=</button>
        <button type="button" class="key key--clear" data-action="clear" aria-label="clear">C</button>
    </div>
</div>
<footer class="footer">
    <a href="https://github.com/aaronkuy">Aaron Kuyucu</a> · Based on a <a href="https://www.youtube.com/watch?v=I5kj-YsmWjM">Bro Code tutorial</a> · <a href="https://github.com/aaronkuy/calculator">Source on GitHub</a>
</footer>

</body>
</html>
